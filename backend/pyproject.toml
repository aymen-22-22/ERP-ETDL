[project]
name = "erp-backend"
version = "0.1.0"
description = "Multi-tenant ERP SaaS backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "redis>=5.2",
    "celery>=5.4",
    "python-multipart>=0.0.20",
    "structlog>=24.4",
    # ASGI->WSGI bridge. Required only for Passenger/cPanel hosting, which
    # serves WSGI; see passenger_wsgi.py. Harmless elsewhere (uvicorn serves
    # the ASGI app directly and never imports this).
    "a2wsgi>=1.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "types-python-jose>=3.3",
    "types-passlib>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are the idiomatic way to declare defaults; they
# aren't the mutable-default footgun B008 targets.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Depends",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
