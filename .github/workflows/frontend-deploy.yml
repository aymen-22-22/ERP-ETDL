name: frontend-deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/frontend-deploy.yml"

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Package the built dist so the archive extracts straight into the doc
      # root (same layout as the manual `unzip -o dist.zip` flow). A plain
      # `dist/`-prefixed archive is the trap that silently deployed into a
      # subfolder on the last manual upload.
      - name: Package dist
        working-directory: frontend
        run: tar -a -cf dist.zip -C dist .

      - name: Upload dist.zip to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "frontend/dist.zip"
          target: "~"
          strip_components: 1

      - name: Extract over doc root
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/stock.etdledger.com
            unzip -o ~/dist.zip
            rm -f ~/dist.zip
            grep -o 'index-[A-Za-z0-9_-]*\.js' index.html
