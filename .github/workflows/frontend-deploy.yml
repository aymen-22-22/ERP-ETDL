name: frontend-deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/frontend-deploy.yml"

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Package the built dist so the archive extracts straight into the doc
      # root (same layout as the manual upload flow). GNU tar compresses with
      # -z; `tar -cf *.zip` would produce a tar masquerading as a zip on the
      # Ubuntu runner, which unzip would reject on the server. Use tar.gz on
      # both ends — GNU tar exists on every cPanel host.
      - name: Package dist
        working-directory: frontend
        run: tar -czf dist.tar.gz -C dist .

      - name: Upload dist.tar.gz to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          source: "frontend/dist.tar.gz"
          target: "~"
          strip_components: 1

      - name: Extract over doc root
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            set -e
            cd ~/stock.etdledger.com
            tar -xzf ~/dist.tar.gz
            rm -f ~/dist.tar.gz
            grep -o 'index-[A-Za-z0-9_-]*\.js' index.html
